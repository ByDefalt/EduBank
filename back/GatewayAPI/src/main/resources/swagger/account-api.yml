openapi: 3.0.0
info:
  title: Account API
  description: API de gestion des comptes, rôles et informations personnelles
  version: 1.1.0
servers:
  - url: http://localhost:8080/api/v1
    description: Serveur de gestion des comptes

paths:

  /roles:
    get:
      summary: Liste tous les rôles (Admin uniquement)
      tags: [ Role ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Liste récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Non autorisé (Token manquant ou invalide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit (Permission insuffisante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/{id}:
    get:
      summary: Récupérer un rôle par son ID
      tags: [ Role ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Rôle non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/name/{name}:
    get:
      summary: Récupérer le rôle associé à un compte
      tags: [ Role ]
      parameters:
        - name: name
          in: path
          description: role du compte
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Rôle non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /personalInformation:
    get:
      summary: Liste toutes les informations personnelles (Admin uniquement)
      tags: [ PersonalInformation ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalInformation'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Créer une fiche d'information personnelle
      tags: [ PersonalInformation ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInformationRegister'
      responses:
        '201':
          description: Créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalInformation'
        '400':
          description: Impossible de créer les informations personnelles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /personalInformation/{id}:
    get:
      summary: Récupérer une info personnelle par ID
      tags: [ PersonalInformation ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalInformation'
        '404':
          description: Non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Mettre à jour une info personnelle par ID
      tags: [ PersonalInformation ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInformation'
      responses:
        '200':
          description: Mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalInformation'
        '400':
          description: Impossible de mettre à jour les informations personnelles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Information personnelle non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts:
    get:
      summary: Liste tous les comptes (Admin uniquement)
      tags: [ Account ]
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Créer un nouveau compte
      description: Crée le compte, le rôle et les informations personnelles liées.
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegister'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Impossible de créer le compte (rôle inexistant, erreur personnelle info, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rôle non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{id}:
    get:
      summary: Récupérer un compte par ID
      tags: [ Account ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compte trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Supprimer un compte (Admin uniquement, par le changement d'etat du compte à ENCLOSE)
      tags: [ Account ]
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compte supprimé avec succès (retourne true)
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/activate/{id}:
    put:
      summary: Activer un compte (Admin uniquement)
      tags: [ Account ]
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compte activé avec succès
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Compte déjà actif ou clôturé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/deactivate/{id}:
    put:
      summary: Désactiver un compte (Admin uniquement)
      tags: [ Account ]
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compte désactivé avec succès
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Compte déjà inactif ou clôturé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/role/{id}:
    get:
      summary: Récupérer le rôle associé à un compte
      tags: [ Account ]
      parameters:
        - name: id
          in: path
          description: ID du compte
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rôle trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Compte ou Rôle non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/personalInformation/{id}:
    get:
      summary: Récupérer les informations personnelles associées à un compte
      tags: [ Account ]
      parameters:
        - name: id
          in: path
          description: ID du compte
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Infos trouvées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalInformation'
        '404':
          description: Compte ou Infos non trouvées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/signin:
    post:
      summary: Connexion utilisateur
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Connexion réussie, retourne le token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRequest'
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Mot de passe incorrect ou compte inactif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/validate:
    post:
      summary: Valider un token JWT
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RoleEnum:
      type: string
      enum:
        - ADMIN
        - CUSTOMER
      example: "CUSTOMER"

    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    PersonalInformation:
      type: object
      properties:
        id:
          type: integer
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        phoneNumber:
          type: string

    PersonalInformationRegister:
      type: object
      required:
        - firstname
        - lastname
        - email
      properties:
        firstname:
          type: string
          example: "John"
        lastname:
          type: string
          example: "Doe"
        email:
          type: string
          example: "john.doe@localhost.com"
          format: email
        address:
          type: string
          example: "123 Main St, Anytown"
        phoneNumber:
          type: string
          example: "0123456789"

    AccountStateEnum:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - ENCLOSE

    Account:
      type: object
      properties:
        id:
          type: string
        personal_info_id:
          type: integer
          description: ID faisant référence à PersonalInformation
        role_id:
          type: integer
          description: ID faisant référence à Role
        state:
          $ref: '#/components/schemas/AccountStateEnum'

    AccountRegister:
      type: object
      required:
        - personal_info
        - role
        - password
      properties:
        personal_info:
          $ref: '#/components/schemas/PersonalInformationRegister'
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          example: "123456789"
          format: password
          writeOnly: true

    SignInRequest:
      type: object
      required:
        - id
        - password
      properties:
        id:
          type: string
          example: "123456789123"
        password:
          type: string
          format: password
          example: "123456789"

    TokenRequest:
      type: object
      required:
        - jwt
      properties:
        jwt:
          type: string
          description: "Token JWT"
          example: "eyJhbGciOiJIUzI1NiJ9..."

    TokenResponse:
      type: object
      description: "Données utilisateur extraites et décodées depuis le token JWT"
      properties:
        id:
          type: string
          description: "Identifiant unique de l'utilisateur (Subject du token)"
          example: "1234567891234"
        role:
          type: string
          description: "Rôle de l'utilisateur"
          example: "ADMIN"

    Error:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Requête invalide"
        details:
          type: string
          example: "Le champ 'amount' doit être supérieur à 0"

  responses:
    UnauthorizedError:
      description: Non autorisé - Token d'authentification manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundError:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequestError:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenError:
      description: Accès interdit - Permissions insuffisantes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'