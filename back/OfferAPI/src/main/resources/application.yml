spring:
  datasource:
    url: jdbc:mariadb://localhost:3384/offerapi
    driver-class-name: org.mariadb.jdbc.Driver
    username: offeruser
    password: offerpassword

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect