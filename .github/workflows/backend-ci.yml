name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-backend-apis:
    name: Test & Coverage (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back/AccountApi
            name: back-AccountApi
          - service: back/BankAPI
            name: back-BankAPI
          - service: back/OfferAPI
            name: back-OfferAPI
          - service: back/OperationAPI
            name: back-OperationAPI

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests + JaCoCo report
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Publish test reports artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            ${{ matrix.service }}/build/reports/
          if-no-files-found: warn

      - name: Publish JaCoCo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-${{ matrix.name }}
          path: |
            ${{ matrix.service }}/build/reports/jacoco/test/jacocoTestReport.xml
            ${{ matrix.service }}/build/reports/jacoco/test/html/
          if-no-files-found: warn

      - name: Add JaCoCo link to job summary
        if: always()
        run: |
          echo "## Coverage report - ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Download artifact: \`jacoco-reports-${{ matrix.name }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/jacoco/test/jacocoTestReport.xml ]; then
            LINE_RATE=$(sed -n 's/.*<counter type="LINE" missed="\([0-9]\+\)" covered="\([0-9]\+\)".*/\1 \2/p' build/reports/jacoco/test/jacocoTestReport.xml | head -n 1)
            MISSED=$(echo "$LINE_RATE" | awk '{print $1}')
            COVERED=$(echo "$LINE_RATE" | awk '{print $2}')
            if [ -n "$MISSED" ] && [ -n "$COVERED" ] && [ $((MISSED + COVERED)) -gt 0 ]; then
              PERCENT=$(awk -v c="$COVERED" -v t="$((MISSED + COVERED))" 'BEGIN { printf "%.2f", (c/t)*100 }')
              echo "- Line coverage: **${PERCENT}%** (${COVERED}/$((MISSED + COVERED)))" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Line coverage: unavailable (invalid JaCoCo counters)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Line coverage: unavailable (JaCoCo XML not found)" >> $GITHUB_STEP_SUMMARY
          fi
